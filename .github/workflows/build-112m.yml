name: Build TR3000 112m Pure

on:
  push:
    branches: [master]
    paths:
      - 'trigger-version.txt'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    if: github.repository == 'Roiung/immortalwrt'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Init environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo mkdir -p /workdir
          sudo chown $USER:$USER /workdir

      - name: Clone official ImmortalWrt v24.10.6 (exact tag)
        working-directory: /workdir
        run: |
          git clone https://github.com/immortalwrt/immortalwrt -b v24.10.6 --single-branch --depth 1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Cache toolchain & dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: tr3000-112m-v24.10.6-${{ hashFiles('112m.seed.config', 'diy-part2.sh') }}
          restore-keys: tr3000-112m-v24.10.6-

      - name: Show kernel version & apply 112m patch
        run: |
          cd openwrt
          echo "=== kernel version pin ==="
          cat include/kernel-6.6
          chmod +x $GITHUB_WORKSPACE/diy-part2.sh
          $GITHUB_WORKSPACE/diy-part2.sh
          git diff --stat || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure & build
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/112m.seed.config .config
          make defconfig
          grep CONFIG_TARGET_mediatek_filogic_DEVICE .config | head -3
          echo "ALL_KMODS: $(grep CONFIG_ALL_KMODS .config)"
          make download -j$(nproc)
          make -j$(nproc) CC="ccache gcc" CXX="ccache g++" || make -j1 V=s

      - name: Check kernel vermagic vs official 24.10.6 (non-fatal)
        id: vermagic
        continue-on-error: true
        run: |
          cd openwrt
          KV=$(grep -oE 'kernel - [^ ]+' bin/targets/mediatek/filogic/*.manifest | head -1 | sed 's/kernel - //')
          echo "Built kernel: $KV"
          if [ "$KV" = "6.6.133~a8b93917f464536104594f27d870028d-r1" ]; then
            echo "MATCH_OFFICIAL=true" >> $GITHUB_OUTPUT
            echo "OK: vermagic matches official — 官方源 kmod 可用"
          else
            echo "MATCH_OFFICIAL=false" >> $GITHUB_OUTPUT
            echo "NOTE: vermagic != official — 使用本产物自带 kmod (自匹配)"
          fi

      - name: Collect artifacts (firmware + kmods, always)
        run: |
          mkdir -p artifacts/kmods
          find openwrt/bin/targets/ -name '*tr3000-v1-ubootmod*' -exec cp {} artifacts/ \;
          find openwrt/bin/targets/ -name 'sha256sums' -path '*filogic*' -exec cp {} artifacts/ \;
          # ALL_KMODS 产物: 全量 kmod ipk (与本固件 vermagic 天然匹配)
          find openwrt/bin/targets/mediatek/filogic -name 'kmod-*.ipk' -newer openwrt/.config -exec cp {} artifacts/kmods/ \; 2>/dev/null || true
          ls artifacts/kmods | head -5
          echo "kmod count: $(ls artifacts/kmods 2>/dev/null | wc -l)"
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-112m-pure-v24106
          path: artifacts/*
          retention-days: 7
