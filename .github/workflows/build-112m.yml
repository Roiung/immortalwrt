name: Build TR3000 112m Pure (25.12.2)

on:
  push:
    branches: [master]
    paths:
      - 'trigger-version.txt'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  OFFICIAL_KERNEL: 6.12.103~b5b7729ffbba3ecdd83f339de8fadfb8-r1
  OFFICIAL_TAG: v25.12.2

jobs:
  build:
    if: github.repository == 'Roiung/immortalwrt'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space (KEEP swap — OOM killed the 1st attempt)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Init environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo mkdir -p /workdir
          sudo chown $USER:$USER /workdir

      - name: Clone official ImmortalWrt v25.12.2 (exact tag)
        working-directory: /workdir
        run: |
          git clone https://github.com/immortalwrt/immortalwrt -b v25.12.2 --single-branch --depth 1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Cache toolchain & dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: tr3000-112m-v25122-${{ hashFiles('112m.seed.config', 'diy-part2.sh') }}
          restore-keys: tr3000-112m-v25122-

      - name: Show kernel version & apply 112m patch
        run: |
          cd openwrt
          echo "=== kernel version pin (25.12: target/linux/generic/kernel-6.12) ==="
          cat target/linux/generic/kernel-6.12 || true
          chmod +x $GITHUB_WORKSPACE/diy-part2.sh
          $GITHUB_WORKSPACE/diy-part2.sh
          echo "=== dts after patch (must be 112m NOW, not after 4h) ==="
          grep -q 'reg = <0x5c0000 0x7000000>;' target/linux/mediatek/dts/mt7981b-cudy-tr3000-v1-ubootmod.dts || { echo "PATCH FAIL: 112m reg not in dts"; exit 1; }
          grep -q '0x7a40000' target/linux/mediatek/dts/mt7981b-cudy-tr3000-v1-ubootmod.dts && { echo "PATCH FAIL: 122m still present"; exit 1; } || true
          echo "dts 112m OK"
          git diff --stat || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure & build
        run: |
          echo "=== resources before build ==="
          nproc; free -h; df -h / /workdir | grep -v tmpfs || true
          swapon --show || true
          cd openwrt
          cp $GITHUB_WORKSPACE/112m.seed.config .config
          make defconfig
          echo "=== FAIL-FAST seed assertions (learned from runs 1-2) ==="
          ND=$(grep -c 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y' .config)
          echo "devices=y: $ND (expect 187 - official full set; pruning devices breaks Netgear recipes)"
          [ "$ND" = "187" ] || { echo "SEED ASSERT FAIL: device count $ND != 187"; exit 1; }
          grep -q 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netgear_eax17=y' .config || { echo "SEED ASSERT FAIL: netgear_eax17 not enabled (its recipe needs ROOTFS_ID)"; exit 1; }
          grep -q 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y' .config || { echo "SEED ASSERT FAIL: tr3000-ubootmod not enabled"; exit 1; }
          echo "ALL_KMODS: $(grep CONFIG_ALL_KMODS .config)"
          grep -q 'CONFIG_ALL_KMODS=y' .config || { echo "SEED ASSERT FAIL: ALL_KMODS lost"; exit 1; }
          make download -j$(nproc) || make download -j1
          make -j$(nproc) CC="ccache gcc" CXX="ccache g++" || make -j1 V=s

      - name: HARD GATE - built dtb must declare 112m ubi
        run: |
          echo "=== resources after build ==="
          free -h; df -h / /workdir | grep -v tmpfs || true
          cd openwrt
          DTB=$(find build_dir -name 'mt7981b-cudy-tr3000-v1-ubootmod.dtb' | head -1)
          echo "dtb: $DTB"
          dtc -I dtb -O dts "$DTB" > /tmp/dts.dump 2>/dev/null
          if grep -q 'reg = <0x5c0000 0x7000000>;' /tmp/dts.dump; then
            echo "GATE OK: ubi reg = 0x5c0000 0x7000000 (112m)"
          else
            echo "GATE FAIL: 112m reg not found in built dtb"; grep -n '0x5c0000' /tmp/dts.dump; exit 1
          fi
          if grep -q '0x7a40000' /tmp/dts.dump; then
            echo "GATE FAIL: stale 122m reg still present"; exit 1
          else
            echo "GATE OK: no 122m (0x7a40000) remnant"
          fi

      - name: Check kernel vermagic vs official 25.12.2 (non-fatal)
        id: vermagic
        continue-on-error: true
        run: |
          cd openwrt
          KV=$(grep -oE 'kernel - [^ ]+' bin/targets/mediatek/filogic/*.manifest | head -1 | sed 's/kernel - //')
          echo "Built kernel: $KV"
          echo "Official   : $OFFICIAL_KERNEL"
          if [ "$KV" = "$OFFICIAL_KERNEL" ]; then
            echo "MATCH_OFFICIAL=true" >> $GITHUB_OUTPUT
            echo "OK: vermagic matches official 25.12.2"
          else
            echo "MATCH_OFFICIAL=false" >> $GITHUB_OUTPUT
            echo "NOTE: vermagic != official, use bundled kmods/ apks (self-matched)"
          fi

      - name: Collect artifacts (firmware + kmods + README)
        run: |
          mkdir -p artifacts/kmods
          find openwrt/bin/targets/ -name '*tr3000-v1-ubootmod*' -exec cp {} artifacts/ \;
          find openwrt/bin/targets/ -name 'sha256sums' -path '*filogic*' -exec cp {} artifacts/ \;
          find openwrt/bin/targets/mediatek/filogic -name 'kmod-*.apk' -newer openwrt/.config -exec cp {} artifacts/kmods/ \; 2>/dev/null || true
          cat > artifacts/README-FLASH.txt <<'EOF'
          TR3000 v1 (NMBM uboot) 112m - ImmortalWrt 25.12.2 official source, ubi 0x7000000 only change
          [FLASH ONLY] *-cudy_tr3000-v1-ubootmod-squashfs-sysupgrade.itb  (sysupgrade -n, do NOT keep settings)
          [DO NOT FLASH] *-preloader.bin / *-bl31-uboot.fip  (official no-NMBM chain, kills modded web uboot)
          kmods/*.apk are vermagic-matched to THIS firmware; if vermagic gate printed MATCH=true,
          official-feed apks (downloads.immortalwrt.org 25.12.2) also install directly.
          EOF
          echo "kmod count: $(ls artifacts/kmods 2>/dev/null | wc -l)"
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-112m-pure-v25122
          path: artifacts/*
          retention-days: 7