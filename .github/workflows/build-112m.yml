name: Build TR3000 112m Pure

on:
  push:
    branches: [master]
    paths:
      - 'trigger-version.txt'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    if: github.repository == 'Roiung/immortalwrt'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Init environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo mkdir -p /workdir
          sudo chown $USER:$USER /workdir

      - name: Clone official ImmortalWrt openwrt-24.10
        working-directory: /workdir
        run: |
          git clone https://github.com/immortalwrt/immortalwrt -b openwrt-24.10 --single-branch --depth 1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Cache toolchain & dl
        uses: actions/cache@v4
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: tr3000-112m-${{ hashFiles('112m.seed.config', 'diy-part2.sh') }}
          restore-keys: tr3000-112m-

      - name: Apply 112m patch & feeds
        run: |
          cd openwrt
          chmod +x $GITHUB_WORKSPACE/diy-part2.sh
          $GITHUB_WORKSPACE/diy-part2.sh
          git diff --stat || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure & build
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/112m.seed.config .config
          make defconfig
          echo '--- selected profile ---'
          grep CONFIG_TARGET_mediatek_filogic_DEVICE .config || true
          make download -j$(nproc)
          make -j$(nproc) CC="ccache gcc" CXX="ccache g++" || make -j1 V=s

      - name: Verify 112m in built dtb
        run: |
          cd openwrt
          DTB=$(find build_dir -name '*tr3000*v1*ubootmod*.dtb' | head -1)
          echo "DTB: $DTB"
          if [ -n "$DTB" ] && dtc -I dtb -O dts "$DTB" 2>/dev/null | grep -q '0x07000000'; then
            echo "OK: ubi=0x7000000 (112M)"
          else
            echo "WARN: 112m marker not found in dtb"
            [ -n "$DTB" ] && dtc -I dtb -O dts "$DTB" 2>/dev/null | grep -B2 -A6 'partition@5c0000' || true
          fi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find openwrt/bin/targets/ -name '*tr3000-v1-ubootmod*' -exec cp {} artifacts/ \;
          find openwrt/bin/targets/ -name 'sha256sums' -path '*filogic*' -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-112m-pure
          path: artifacts/*
          retention-days: 7

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tr3000-112m-${{ github.run_number }}
          files: artifacts/*
        continue-on-error: true
